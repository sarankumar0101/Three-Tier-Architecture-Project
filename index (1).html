<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Operations Center</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #eafbf3; color: #16304b; }
    header { padding: 32px 16px; text-align: center; background: #08795b; color: white; }
    main { max-width: 720px; margin: 48px auto; padding: 36px 24px; background: white;
            border-radius: 16px; text-align: center; box-shadow: 0 8px 28px #00000012; }
    .status { display: inline-block; padding: 12px 18px; margin: 14px 0; border-radius: 24px;
               background: #d8f8e8; color: #075d43; font-weight: bold; }
    footer { text-align: center; color: #61748b; padding: 24px; }
  </style>
</head>
<body>
  <header><h1>Cloud Operations Center</h1><p>Infrastructure Monitoring Portal</p></header>
  <main>
    <h2>Welcome to Public Server 2</h2>
    <p>This page is served by Nginx on an Amazon EC2 instance.</p>
    <div class="status">SERVER ONLINE</div>
    <p><strong>Platform:</strong> Amazon EC2</p>
    <p><strong>Service:</strong> Nginx</p>
    <p><strong>Role:</strong> Public Web Tier</p>
  </main>
  <footer>DevOps Project | AWS EC2 | Public Server 2</footer>
</body>
</html>
